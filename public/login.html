<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="/logo%20empresa.jpeg">
    <link rel="apple-touch-icon" href="/logo%20empresa.jpeg">
    <title>Iniciar sesión · LandMosaic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
      :root{
        --g-900:#14532d; --g-800:#166534; --g-700:#15803d; --g-600:#16a34a;
        --g-100:#dcfce7; --ink:#0f1d14; --muted:#5b6b60; --line:#dfe7e1; --card:#ffffff;
      }
      *{box-sizing:border-box;}
      body{
        margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
        font-family:'DM Sans',system-ui,-apple-system,sans-serif; color:var(--ink); padding:24px;
        background:linear-gradient(rgba(8,20,12,.58),rgba(8,20,12,.58)), url("/Fondo_login.jpg") center/cover no-repeat fixed;
      }
      .login-card{
        width:100%; max-width:400px; background:rgba(255,255,255,.97);
        border:1px solid rgba(255,255,255,.55); border-radius:20px;
        box-shadow:0 24px 60px rgba(0,0,0,.38); padding:34px 30px; backdrop-filter:blur(6px);
      }
      .login-logo{
        width:96px; height:96px; border-radius:50%; overflow:hidden; margin:0 auto 18px;
        background:var(--g-800); display:grid; place-items:center; box-shadow:0 8px 22px rgba(20,83,45,.32);
      }
      .login-logo img{width:100%; height:100%; object-fit:cover;}
      .login-card__head{text-align:center; margin-bottom:24px;}
      .login-card__head h2{font-size:23px; font-weight:700; margin:0 0 6px;}
      .login-card__head p{font-size:14px; color:var(--muted); margin:0;}
      .field{margin-bottom:16px;}
      .field label{display:block; font-size:13px; font-weight:600; color:var(--g-800); margin-bottom:7px;}
      .field__control{display:flex; align-items:center; gap:9px; border:1px solid var(--line); background:#fff; border-radius:11px; padding:0 12px; transition:border-color .15s, box-shadow .15s;}
      .field__control:focus-within{border-color:var(--g-600); box-shadow:0 0 0 3px var(--g-100);}
      .field__control > i{color:#94a59a; font-size:14px;}
      .field__control input{flex:1; border:0; outline:0; background:transparent; font:inherit; font-size:15px; padding:12px 0; color:var(--ink);}
      .field__toggle{border:0; background:transparent; color:#94a59a; cursor:pointer; font-size:14px; padding:6px;}
      .field__toggle:hover{color:var(--g-700);}
      .login-btn{width:100%; margin-top:6px; border:0; border-radius:11px; padding:13px; font:inherit; font-size:15px; font-weight:600; color:#fff; background:var(--g-700); cursor:pointer; transition:background .15s, transform .05s; box-shadow:0 8px 18px rgba(22,101,52,.28);}
      .login-btn:hover{background:var(--g-800);}
      .login-btn:active{transform:translateY(1px);}
      .login-error{color:#dc2626; font-size:13.5px; text-align:center; margin:14px 0 0;}
      .login-error:empty{display:none;}
      .login-notice{display:flex; align-items:center; gap:9px; background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; border-radius:11px; padding:11px 13px; font-size:13.5px; margin-bottom:18px;}
      .login-notice[hidden]{display:none;}
    </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo"><img src="/logo empresa.jpeg" alt="Logo de la empresa"></div>
    <div class="login-card__head">
      <h2>Bienvenido</h2>
      <p>Ingresa tus credenciales para continuar</p>
    </div>

    <div id="login-notice" class="login-notice" hidden></div>

    <form id="loginForm" action="/api/auth/login" method="POST" class="login-form">
      <div class="field">
        <label for="username">Usuario</label>
        <div class="field__control">
          <i class="fas fa-user"></i>
          <input type="text" id="username" name="username" required placeholder="Ingrese su usuario" autocomplete="username">
        </div>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <div class="field__control">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" name="password" required placeholder="Ingrese su contraseña" autocomplete="current-password">
          <button type="button" class="field__toggle" id="togglePass" aria-label="Mostrar contraseña"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <button type="submit" class="login-btn">Iniciar sesión</button>
      <p id="mensajeError" class="login-error"></p>
    </form>
  </div>

  <script>
    (function () {
      var tg = document.getElementById('togglePass'), pw = document.getElementById('password');
      if (tg && pw) {
        tg.addEventListener('click', function () {
          var ver = pw.type === 'password';
          pw.type = ver ? 'text' : 'password';
          tg.innerHTML = ver ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
        });
      }
      var alertKey = new URLSearchParams(window.location.search).get('alert');
      if (alertKey === 'login-required') {
        var n = document.getElementById('login-notice');
        n.innerHTML = '<i class="fas fa-circle-info"></i><span>Debes iniciar sesión para continuar.</span>';
        n.hidden = false;
      }
    })();
  </script>
